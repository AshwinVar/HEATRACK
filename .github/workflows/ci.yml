name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: familypulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      FP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/familypulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check app tests alembic
      - run: uv run ruff format --check app tests alembic
      - run: uv run mypy app
      - run: uv run pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-apk:
    # Compiles the Kotlin Health Connect collector and produces an installable debug APK.
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      # Debug build for a local/emulator backend (dev auth). For the real phone, build
      # release locally with the Supabase defines from the README.
      - run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:8000
          --dart-define=AUTH_MODE=dev
      - uses: actions/upload-artifact@v4
        with:
          name: familypulse-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --dart-define=AUTH_MODE=dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t familypulse-backend:ci backend
